name: Smoke test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: rocker/r-ver:4.5
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "magrittr"))'

      - name: Run smoke test
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
        run: Rscript R/smoke_test.R