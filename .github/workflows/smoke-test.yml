name: Smoke test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: Rscript -e 'install.packages(c("httr2", "magrittr"))'

      - name: Run smoke test
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
        run: Rscript R/smoke_test.R