name: Update dashboard data

# GitHub's scheduler is best effort: runs are often hours late or dropped,
# worst on the hour and half hour. So the schedules use odd minutes, and the
# reliable trigger is an external cron service calling workflow_dispatch
# every 15 min with match_window_only = true (setup notes in CLAUDE.md).
on:
  schedule:
    # Every 30 min, 11:07-23:37 UTC. Only fetches from FPL if a match kicked
    # off in the last 3 hours (see MATCH_WINDOW_ONLY below).
    - cron: "7,37 11-23 * * *"
    # Daily full run: picks up final bonus points and anything missed
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      match_window_only:
        description: "Only fetch if a match kicked off in the last 3 hours"
        type: boolean
        default: false

permissions:
  contents: write

# Never run two updates at once (they would both try to push)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: rocker/r-ver:4.5
    steps:
      # The R container lacks git (checkout needs it to allow pushing back)
      # and libuv1 (the pre-built `fs` package needs it to load)
      - name: Install system libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git libuv1

      - uses: actions/checkout@v5

      - name: Install R packages
        run: >
          Rscript -e 'install.packages(c("httr2", "jsonlite", "dplyr", "purrr",
          "fs", "magrittr", "tibble", "tidyr", "readr", "stringr"))'

      - name: Fetch from FPL
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          MATCH_WINDOW_ONLY: ${{ github.event.schedule == '7,37 11-23 * * *' || inputs.match_window_only == true }}
        run: Rscript R/01_ingest.R

      - name: Build metrics and export JSON
        run: Rscript R/03_export.R

      # data/raw is only committed alongside a dashboard change. Anything not
      # frozen is refetched every run anyway, so nothing is lost by skipping.
      - name: Commit if the dashboard data changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -z "$(git status --porcelain -- docs/data)" ]; then
            echo "Dashboard data unchanged - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/raw
          git commit -m "Update dashboard data"
          git pull --rebase
          git push
