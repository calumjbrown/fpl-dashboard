name: Update dashboard data

# GitHub's scheduler is best effort: runs are often hours late or dropped.
# The reliable trigger is the Cloudflare Worker (worker/fpl-live.js): its
# 15-minute timer calls workflow_dispatch only within 3 hours after a
# deadline or kickoff (match_window_only = true), plus a full run each
# morning at 06:00 UTC. GitHub's own daily schedule below is just a backup.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      match_window_only:
        description: "Only fetch if a match kicked off in the last 3 hours"
        type: boolean
        default: false

permissions:
  contents: write

# Never run two updates at once (they would both try to push)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: rocker/r-ver:4.5
    steps:
      # The R container lacks git (checkout needs it to allow pushing back)
      # and libuv1 (the pre-built `fs` package needs it to load). Ubuntu's
      # package servers sometimes fail (exit code 100 on 11 Nov 2026), so
      # try up to 5 times, 30 seconds apart
      - name: Install system libraries
        run: |
          for attempt in 1 2 3 4 5; do
            apt-get -o Acquire::Retries=3 update &&
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
                --no-install-recommends git libuv1 && exit 0
            echo "Package install failed (attempt $attempt of 5) - retrying in 30s"
            sleep 30
          done
          exit 1

      - uses: actions/checkout@v5

      - name: Install R packages
        run: >
          Rscript -e 'install.packages(c("httr2", "jsonlite", "dplyr", "purrr",
          "fs", "magrittr", "tibble", "tidyr", "readr", "stringr"))'

      - name: Fetch from FPL
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          # true for the Worker's match-window runs (sent as "true" text);
          # false for its morning run, GitHub's daily backup and manual runs
          MATCH_WINDOW_ONLY: ${{ inputs.match_window_only == true || inputs.match_window_only == 'true' }}
        run: Rscript R/01_ingest.R

      - name: Build metrics and export JSON
        run: Rscript R/03_export.R

      # data/raw is only committed alongside a dashboard change. Anything not
      # frozen is refetched every run anyway, so nothing is lost by skipping.
      - name: Commit if the dashboard data changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -z "$(git status --porcelain -- docs/data)" ]; then
            echo "Dashboard data unchanged - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/raw
          git commit -m "Update dashboard data"
          git pull --rebase
          git push
